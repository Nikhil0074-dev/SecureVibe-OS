name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/compiler-service/requirements.txt -r services/ai-service/requirements.txt pytest python-hcl2
      - run: python -m pytest -q services/ai-service/tests
      - run: cd services/compiler-service && python -m pytest -q tests
      - run: python scripts/e2e.py
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - run: pnpm install && pnpm --filter @securevibe/ir-schema test && pnpm --filter @securevibe/devops-service test
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: cd services/security-service && go test ./...
  rego:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
      - run: cd packages/security-rules && opa test src tests -v
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, severity: "HIGH,CRITICAL" }
