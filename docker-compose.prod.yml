services:
  postgres:
    image: postgres:15
    environment: { POSTGRES_USER: securevibe, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-securevibe}", POSTGRES_DB: securevibe }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevibe -d securevibe"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: neo4j/securevibe123 }
    ports: ["7474:7474", "7687:7687"]
  localstack:
    image: localstack/localstack
    ports: ["4566:4566"]
  ai-service:
    build: ./services/ai-service
    env_file: .env
    environment: { COMPILER_SERVICE_URL: "http://compiler-service:8002" }
    ports: ["8001:8001"]
  compiler-service:
    build: { context: ., dockerfile: services/compiler-service/Dockerfile }
    ports: ["8002:8002"]
  security-service:
    build: ./services/security-service
    ports: ["8003:8003"]
  reverse-parser-service:
    build: ./services/reverse-parser-service
    ports: ["8004:8004"]
  devops-service:
    build: ./services/devops-service
    ports: ["8005:8005"]
  api-gateway:
    build: ./apps/api-gateway
    env_file: .env
    environment:
      AI_SERVICE_URL: http://ai-service:8001
      COMPILER_SERVICE_URL: http://compiler-service:8002
      SECURITY_SERVICE_URL: http://security-service:8003
      REVERSE_PARSER_URL: http://reverse-parser-service:8004
      DEVOPS_SERVICE_URL: http://devops-service:8005
      DATABASE_URL: "postgres://securevibe:${POSTGRES_PASSWORD:-securevibe}@postgres:5432/securevibe"
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      compiler-service:
        condition: service_started
      security-service:
        condition: service_started
      reverse-parser-service:
        condition: service_started
      devops-service:
        condition: service_started
  web:
    build: ./apps/web
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:4000" }
    ports: ["3000:3000"]
volumes: { pgdata: {} }
