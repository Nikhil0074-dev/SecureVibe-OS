apiVersion: apps/v1
kind: Deployment
metadata: { name: ai-service }
spec:
  replicas: 2
  selector: { matchLabels: { app: ai-service } }
  template:
    metadata: { labels: { app: ai-service } }
    spec:
      runtimeClassName: gvisor        # sandboxed runtime for untrusted-input workloads
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ai-service
          image: securevibe/ai-service:latest
          ports: [{ containerPort: 8001 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health, port: 8001 } }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
